# Publishes the package from main. The file name must stay `publish.yml`:
# npm trusted publishing (OIDC) is configured for this exact workflow file.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read version
        id: version
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm, publishing is skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.version.outputs.published == 'false'

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public

      - name: Create tag and GitHub release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            node .github/scripts/extract-release-notes.mjs "${{ steps.version.outputs.version }}" > notes.md
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  backmerge:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Open backmerge pull request main → develop
        run: |
          ahead=$(git rev-list --count origin/develop..origin/main)
          if [ "$ahead" -eq 0 ]; then
            echo "develop already contains main."
            exit 0
          fi
          existing=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Backmerge pull request #$existing is already open."
            exit 0
          fi
          version=$(jq -r .version package.json)
          gh pr create --base develop --head main \
            --title "chore: backmerge v$version into develop" \
            --body "Automatic backmerge after release v$version. Merge with a **merge commit** (not squash)."
        env:
          GH_TOKEN: ${{ github.token }}
