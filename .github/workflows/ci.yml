name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Check package contents
        run: |
          # Installing ts-ds must not pull any other package.
          jq -e '[.dependencies, .peerDependencies, .optionalDependencies] | map(. // {} | length) | add == 0' package.json \
            || { echo "::error::package.json must not have runtime dependencies"; exit 1; }
          npm pack --dry-run --ignore-scripts

      - name: Check exports and types (publint, arethetypeswrong)
        run: npm run check:package

      - name: Install the package into an empty project and use it
        run: node .github/scripts/smoke-test-package.mjs

  version-policy:
    name: version-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check version policy
        run: node .github/scripts/check-version-policy.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
